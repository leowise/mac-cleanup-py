name: Tests

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ macos-latest ]
        python-version: [ '3.10', '3.11', '3.12', '3.13', '3.14' ]
        include:
          - os: macos-26
            python-version: 3.x
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python v${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - name: Install tox-gh-actions
        run: |
          python -m pip install --upgrade pip
          pip install tox tox-gh-actions
      - name: Tests with Tox
        run: tox

  dependency-audit:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip poetry pip-audit
          poetry config virtualenvs.in-project true
          poetry install --only main --no-root
      - name: Audit project dependencies
        # Audit the project's own virtualenv, not the runner's global environment
        run: pip-audit --path .venv/lib/python*/site-packages
